databaseChangeLog:
  - changeSet:
      id: 002-seed-books
      author: volodymyr.dobrianskyi
      changes:
        - loadData:
            file: db/changelog/data/books.csv
            relativeToChangelogFile: false
            tableName: books
            usePreparedStatements: true
        - sql:
            sql: |
              INSERT INTO book_stock (quantity, price, book_id)
              SELECT 10, 19.99, id
              FROM books;
