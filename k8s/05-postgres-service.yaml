apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: uni-book-store
  labels:
    app: postgres
    app.kubernetes.io/part-of: uni-book-store
spec:
  type: ClusterIP           # internal only — reached by the backend as "postgres:5432"
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
