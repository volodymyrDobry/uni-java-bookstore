apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: uni-book-store
  labels:
    app: backend
    app.kubernetes.io/part-of: uni-book-store
data:
  # --- Non-sensitive application configuration (injected as env vars) ---
  # Datasource host/port consumed by application.yaml: ${DB_HOST}/${DB_PORT}
  DB_HOST: "postgres"
  DB_PORT: "5432"
  # Keycloak issuer base; the JWT decoder is lazy, so the app starts even
  # when Keycloak is not deployed in the cluster.
  KEYCLOAK_URI: "http://keycloak:8080"
  # PostgreSQL bootstrap parameters (also consumed by the postgres container)
  POSTGRES_DB: "mydatabase"
  POSTGRES_USER: "myuser"
  # Expose health + info actuator endpoints and enable liveness/readiness
  # probe groups used by the Deployment probes.
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_INFO_ENV_ENABLED: "true"
