apiVersion: v1
kind: Service
metadata:
  name: book-management-service
  namespace: uni-book-store
  labels:
    app: book-management-service
    app.kubernetes.io/part-of: uni-book-store
spec:
  # ClusterIP: reached in-cluster by the frontend nginx gateway (and order-service
  # peers) via the DNS name `book-management-service:8081`.
  type: ClusterIP
  selector:
    app: book-management-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
