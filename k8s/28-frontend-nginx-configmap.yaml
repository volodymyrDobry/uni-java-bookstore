apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: uni-book-store
  labels:
    app: frontend
    app.kubernetes.io/part-of: uni-book-store
data:
  # Mounted over the image's /etc/nginx/conf.d/default.conf. The image bakes a
  # Docker-Compose gateway config that uses `resolver 127.0.0.11` (Docker's
  # embedded DNS), which does not exist in Kubernetes. Here we use static upstreams
  # instead: a Service DNS name is always resolvable once the Service exists, so
  # nginx starts cleanly and routes to the right microservice.
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        # book-management-service — catalogue (/api/v1/books, /api/v1/books/low-stock-digests, ...)
        location ^~ /api/v1/books {
            proxy_pass http://book-management-service:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # order-service — admin live stream (SSE) & receipts ZIP export
        location ^~ /api/v1/admin/orders {
            proxy_pass http://order-service:8083;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events: keep the connection open and unbuffered.
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            chunked_transfer_encoding off;
        }

        # order-service — basket, user orders & receipts (everything else under /api/)
        location ^~ /api/ {
            proxy_pass http://order-service:8083;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Receipt PDFs can be large — stream them straight through.
            proxy_buffering off;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # React Router — fallback all routes to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Disable caching for index.html so new deploys are picked up immediately
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
