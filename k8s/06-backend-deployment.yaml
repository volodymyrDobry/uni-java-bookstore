apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: uni-book-store
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Make keycloak.local resolve INSIDE the pod to the minikube node, where
      # the nginx ingress listens on :80 — so the backend can fetch the JWKS
      # from the SAME issuer URL the browser uses. If `minikube ip` is not
      # 192.168.49.2, update this address (see README).
      hostAliases:
        - ip: "192.168.49.2"
          hostnames:
            - keycloak.local
      containers:
        - name: backend
          image: uni-book-store-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/liveness
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/readiness
            periodSeconds: 10
            failureThreshold: 3

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: [ "sh","-c","until nc -z postgres 5432; do sleep 2; done" ]