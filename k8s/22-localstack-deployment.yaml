apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: uni-book-store
  labels:
    app: localstack
    app.kubernetes.io/part-of: uni-book-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: localstack
        app.kubernetes.io/part-of: uni-book-store
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3
          env:
            - name: SERVICES
              value: "s3"
            - name: DEBUG
              value: "0"
          ports:
            - name: edge
              containerPort: 4566
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 30
            periodSeconds: 15
