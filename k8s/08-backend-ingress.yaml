apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: uni-book-store
  labels:
    app: backend
spec:
  ingressClassName: nginx
  rules:
    # Direct access to the backend API for debugging. The SPA itself reaches the
    # backend same-origin through the frontend nginx proxy (uni-book-store.local/api),
    # so this host is optional. uni-book-store.local is owned by the frontend.
    - host: api.uni-book-store.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80