apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: uni-book-store
  labels:
    app: backend
spec:
  ingressClassName: nginx
  rules:
    - host: uni-book-store.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80