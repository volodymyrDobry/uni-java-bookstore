apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: uni-book-store
  labels:
    app: order-service
    app.kubernetes.io/part-of: uni-book-store
spec:
  # ClusterIP: reached in-cluster by the frontend nginx gateway via the DNS name
  # `order-service:8083` (basket, orders, admin orders incl. the SSE stream).
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
