apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: uni-book-store
  labels:
    app: backend
    app.kubernetes.io/part-of: uni-book-store
spec:
  # NodePort gives access both inside the cluster and from the host
  # (via `minikube service backend -n uni-book-store`).
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
