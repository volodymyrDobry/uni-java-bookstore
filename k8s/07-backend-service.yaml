apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: uni-book-store
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
    # Extra port so the frontend nginx can proxy to `backend:8080`
    # (its nginx.conf uses proxy_pass http://backend:8080).
    - name: proxy
      port: 8080
      targetPort: 8080
