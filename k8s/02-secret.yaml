apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: uni-book-store
  labels:
    app: backend
    app.kubernetes.io/part-of: uni-book-store
type: Opaque
# Demo credentials only — NOT real passwords from any working system.
# stringData lets us keep plain text here; Kubernetes stores it base64-encoded.
stringData:
  # Consumed by Spring Boot (SPRING_DATASOURCE_PASSWORD -> spring.datasource.password),
  # overriding the default baked into application.yaml.
  SPRING_DATASOURCE_PASSWORD: "S3cr3tP@ssw0rd_demo"
  # Same value used to initialise the PostgreSQL container.
  POSTGRES_PASSWORD: "S3cr3tP@ssw0rd_demo"
