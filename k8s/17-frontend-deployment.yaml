apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: uni-book-store
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Built from ui-book-store-client with the cluster's OIDC authority
          # baked in (see README). nginx serves the SPA and proxies /api -> backend:8080.
          image: uni-book-store-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            # Override the image's Docker-Compose gateway config with the
            # Kubernetes one (static Service upstreams instead of Docker DNS).
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx
            items:
              - key: default.conf
                path: default.conf
