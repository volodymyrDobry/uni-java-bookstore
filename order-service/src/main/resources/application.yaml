spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/mydatabase
    username: myuser
    password: secret
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URI:http://localhost:8080}/realms/uni-book-store

  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
  jms:
    listener:
      acknowledge-mode: auto

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 3
          jobStore:
            misfireThreshold: 10000
            # PostgreSQL stores Quartz BLOB columns (e.g. JOB_DETAILS.JOB_DATA)
            # as bytea. The default StdJDBCDelegate reads them incorrectly
            # ("Bad value for type long"); the PostgreSQL delegate handles bytea.
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

app:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:ubs-receipts}
    access-key: ${S3_ACCESS_KEY:test}
    secret-key: ${S3_SECRET_KEY:test}
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:50}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${SERVER_PORT:8083}

security:
  cors:
    allowed-headers: "*"
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
