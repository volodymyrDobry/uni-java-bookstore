spring:
  application:
    name: book-management-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/mydatabase
    username: myuser
    password: secret
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URI:http://localhost:8080}/realms/uni-book-store

  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
  jms:
    listener:
      acknowledge-mode: auto

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    env:
      enabled: true
  metrics:
    distribution:
      # Lab 7: emit http_server_requests_seconds_bucket for p95 latency.
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    # Surfaced at /actuator/info so each deployed image tag is identifiable
    # (used by the GitOps update demo in Lab 5). Set via the APP_VERSION env.
    version: ${APP_VERSION:dev}

logging:
  # Lab 7: one JSON object per line on stdout (the ObservabilityFilter builds it),
  # so Loki can parse request logs with `| json`.
  pattern:
    console: "%msg%n"

server:
  port: ${SERVER_PORT:8081}

security:
  cors:
    allowed-headers: "*"
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
