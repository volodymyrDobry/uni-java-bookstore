databaseChangeLog:
  - changeSet:
      id: 007-create-low-stock-digest
      author: volodymyr.dobrianskyi
      changes:
        - createTable:
            tableName: low_stock_digest
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: threshold
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: only_enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: item_count
                  type: INT
                  constraints:
                    nullable: false
        - createIndex:
            tableName: low_stock_digest
            indexName: idx_low_stock_digest_created_at
            columns:
              - column:
                  name: created_at
        - createTable:
            tableName: low_stock_digest_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: digest_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_low_stock_digest_item_digest
                    references: low_stock_digest(id)
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: low_stock_digest_item
        - dropTable:
            tableName: low_stock_digest
