databaseChangeLog:
  - changeSet:
      id: 004-create-ordering-tables
      author: volodymyr.dobrianskyi
      changes:
        - createTable:
            tableName: ordering
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: pdf_location
                  type: TEXT
        - createIndex:
            tableName: ordering
            indexName: idx_ordering_customer_id
            columns:
              - column:
                  name: customer_id
        - createIndex:
            tableName: ordering
            indexName: idx_ordering_created_at
            columns:
              - column:
                  name: created_at
        - createTable:
            tableName: order_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ordering_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_item_ordering
                    references: ordering(id)
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_item_book
                    references: books(id)
              - column:
                  name: count
                  type: INT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: order_item
            columnNames: ordering_id, book_id
            constraintName: uk_order_item_book
        - sql:
            sql: ALTER TABLE order_item ADD CONSTRAINT ck_order_item_count_positive CHECK (count > 0)
      rollback:
        - dropTable:
            tableName: order_item
        - dropTable:
            tableName: ordering
