apply plugin: 'java-library'

dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.aspectj:aspectjweaver'
    api 'org.springframework.boot:spring-boot-starter-liquibase'
    // Messaging: ActiveMQ "Classic" client + Spring JMS, shared by both services
    // so they exchange the order/stock events declared in this module.
    api 'org.springframework.boot:spring-boot-starter-activemq'

    runtimeOnly 'org.postgresql:postgresql'
}
