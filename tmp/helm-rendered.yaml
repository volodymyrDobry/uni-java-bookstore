---
# Source: uni-book-store/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: uni-book-store
  labels:
    helm.sh/chart: uni-book-store-0.1.0
    app.kubernetes.io/name: uni-book-store
    app.kubernetes.io/instance: uni-book-store
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
type: Opaque
# Values come from the chart values (never hard-coded in the template).
stringData:
  SPRING_DATASOURCE_PASSWORD: "S3cr3tP@ssw0rd_demo"
  POSTGRES_PASSWORD: "S3cr3tP@ssw0rd_demo"

---
# Source: uni-book-store/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: uni-book-store-backend
  labels:
    helm.sh/chart: uni-book-store-0.1.0
    app.kubernetes.io/name: uni-book-store
    app.kubernetes.io/instance: uni-book-store
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backend
data:
  # DB connection points at the release's own Postgres Service (release-based name).
  DB_HOST: "uni-book-store-postgres"
  DB_PORT: "5432"
  SPRING_DATASOURCE_USERNAME: "myuser"
  # Also used by the Postgres container.
  POSTGRES_DB: "mydatabase"
  POSTGRES_USER: "myuser"
  KEYCLOAK_URI: "http://keycloak.local"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_INFO_ENV_ENABLED: "true"

---
# Source: uni-book-store/templates/backend-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: uni-book-store-backend
  labels:
    helm.sh/chart: uni-book-store-0.1.0
    app.kubernetes.io/name: uni-book-store
    app.kubernetes.io/instance: uni-book-store
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: uni-book-store
    app.kubernetes.io/instance: uni-book-store
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
      nodePort: 30080

---
# Source: uni-book-store/templates/postgres-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: uni-book-store-postgres
  labels:
    helm.sh/chart: uni-book-store-0.1.0
    app.kubernetes.io/name: uni-book-store
    app.kubernetes.io/instance: uni-book-store
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: uni-book-store
    app.kubernetes.io/instance: uni-book-store
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---
# Source: uni-book-store/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uni-book-store-backend
  labels:
    helm.sh/chart: uni-book-store-0.1.0
    app.kubernetes.io/name: uni-book-store
    app.kubernetes.io/instance: uni-book-store
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uni-book-store
      app.kubernetes.io/instance: uni-book-store
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uni-book-store
        app.kubernetes.io/instance: uni-book-store
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z uni-book-store-postgres 5432; do echo waiting for postgres; sleep 2; done"
      containers:
        - name: backend
          image: "uni-book-store-backend:1.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: uni-book-store-backend
            - secretRef:
                name: uni-book-store
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 250m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

---
# Source: uni-book-store/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uni-book-store-postgres
  labels:
    helm.sh/chart: uni-book-store-0.1.0
    app.kubernetes.io/name: uni-book-store
    app.kubernetes.io/instance: uni-book-store
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uni-book-store
      app.kubernetes.io/instance: uni-book-store
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uni-book-store
        app.kubernetes.io/instance: uni-book-store
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "mydatabase"
            - name: POSTGRES_USER
              value: "myuser"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uni-book-store
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U myuser -d mydatabase"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
