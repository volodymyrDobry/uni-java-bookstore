# PROD environment overrides (applied on top of values.yaml).
# Heavier: 3 replicas, larger resources, 1.1.0 image, Ingress enabled,
# durable DB. No NodePort — access goes through the Ingress only.

backend:
  replicaCount: 3
  image:
    tag: "1.1.0"
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

ingress:
  enabled: true
  host: "uni-book-store.example.com"

postgres:
  persistence:
    enabled: true
    size: "5Gi"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
