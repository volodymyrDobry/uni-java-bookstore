apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uni-book-store.fullname" . }}-config
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
data:
  # DB connection points at the release's own Postgres Service (release-based name).
  DB_HOST: {{ include "uni-book-store.postgres.fullname" . | quote }}
  DB_PORT: {{ .Values.postgres.service.port | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  # Issuer host — the SAME URL the browser uses, so JWT validation matches.
  KEYCLOAK_URI: {{ printf "http://%s" .Values.ingress.keycloakHost | quote }}
  # Infrastructure the services reach by their release-based Service DNS names.
  ACTIVEMQ_URL: {{ printf "tcp://%s:%v" (include "uni-book-store.activemq.fullname" .) .Values.activemq.openwirePort | quote }}
  S3_ENDPOINT: {{ printf "http://%s:%v" (include "uni-book-store.localstack.fullname" .) .Values.localstack.port | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
