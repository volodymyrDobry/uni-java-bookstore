apiVersion: v1
kind: Service
metadata:
  name: {{ include "uni-book-store.localstack.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: localstack
spec:
  type: ClusterIP
  selector:
    {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "localstack") | nindent 4 }}
  ports:
    - name: edge
      port: {{ .Values.localstack.port }}
      targetPort: {{ .Values.localstack.port }}
