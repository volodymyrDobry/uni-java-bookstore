apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uni-book-store.keycloak.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
# Demo credentials only — not real secrets.
stringData:
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  KC_DB_PASSWORD: {{ .Values.keycloakDb.auth.password | quote }}
  POSTGRES_PASSWORD: {{ .Values.keycloakDb.auth.password | quote }}
