apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uni-book-store.frontend.fullname" . }}-nginx
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # Mounted over the image's baked (Docker-Compose) gateway config, which uses
  # Docker's embedded DNS resolver. In Kubernetes we use static Service upstreams:
  # a Service DNS name always resolves once the Service exists, so nginx starts
  # cleanly and fans /api out to the right microservice.
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
        gzip_min_length 1024;

        # book-management-service — catalogue (/api/v1/books, .../low-stock-digests, ...)
        location ^~ /api/v1/books {
            proxy_pass http://{{ include "uni-book-store.bookManagement.fullname" . }}:{{ .Values.bookManagement.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # order-service — admin live stream (SSE) & receipts ZIP export
        location ^~ /api/v1/admin/orders {
            proxy_pass http://{{ include "uni-book-store.orderService.fullname" . }}:{{ .Values.orderService.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events: keep the connection open and unbuffered.
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            chunked_transfer_encoding off;
        }

        # order-service — basket, user orders & receipts (everything else under /api/)
        location ^~ /api/ {
            proxy_pass http://{{ include "uni-book-store.orderService.fullname" . }}:{{ .Values.orderService.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
