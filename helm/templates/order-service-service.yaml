apiVersion: v1
kind: Service
metadata:
  name: {{ include "uni-book-store.orderService.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: order-service
spec:
  type: ClusterIP
  selector:
    {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "order-service") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.orderService.service.port }}
      targetPort: {{ .Values.orderService.containerPort }}
