apiVersion: v1
kind: Service
metadata:
  name: {{ include "uni-book-store.activemq.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: activemq
spec:
  type: ClusterIP
  selector:
    {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "activemq") | nindent 4 }}
  ports:
    - name: openwire
      port: {{ .Values.activemq.openwirePort }}
      targetPort: {{ .Values.activemq.openwirePort }}
    - name: console
      port: {{ .Values.activemq.consolePort }}
      targetPort: {{ .Values.activemq.consolePort }}
