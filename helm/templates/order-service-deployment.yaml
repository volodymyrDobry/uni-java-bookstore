apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uni-book-store.orderService.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: order-service
spec:
  replicas: {{ .Values.orderService.replicaCount }}
  selector:
    matchLabels:
      {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "order-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "order-service") | nindent 8 }}
    spec:
      {{- include "uni-book-store.keycloakHostAliases" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "uni-book-store.postgres.fullname" . }} {{ .Values.postgres.service.port }}; do sleep 2; done"]
        - name: wait-for-activemq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "uni-book-store.activemq.fullname" . }} {{ .Values.activemq.openwirePort }}; do sleep 2; done"]
        - name: wait-for-localstack
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "uni-book-store.localstack.fullname" . }} {{ .Values.localstack.port }}; do sleep 2; done"]
      containers:
        - name: order-service
          image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.orderService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.orderService.containerPort }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.orderService.containerPort | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "uni-book-store.fullname" . }}-config
            - secretRef:
                name: {{ include "uni-book-store.fullname" . }}
          resources:
            {{- toYaml .Values.orderService.resources | nindent 12 }}
          # Hold liveness/readiness off until the app has booted (~45s), so a slow
          # start is not mistaken for a failure and killed into a crash loop.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.orderService.containerPort }}
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.orderService.containerPort }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.orderService.containerPort }}
            periodSeconds: 10
            failureThreshold: 3
