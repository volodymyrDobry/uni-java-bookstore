{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uni-book-store.bookManagement.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: book-management
spec:
  replicas: {{ .Values.bookManagement.replicaCount }}
  selector:
    matchLabels:
      {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "book-management") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "book-management") | nindent 8 }}
    spec:
      {{- include "uni-book-store.keycloakHostAliases" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "uni-book-store.postgres.fullname" . }} {{ .Values.postgres.service.port }}; do sleep 2; done"]
        - name: wait-for-activemq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "uni-book-store.activemq.fullname" . }} {{ .Values.activemq.openwirePort }}; do sleep 2; done"]
      containers:
        - name: book-management-service
          image: "{{ .Values.bookManagement.image.repository }}:{{ .Values.bookManagement.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.bookManagement.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.bookManagement.containerPort }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.bookManagement.containerPort | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "uni-book-store.fullname" . }}-config
            - secretRef:
                name: {{ include "uni-book-store.secretName" . }}
          resources:
            {{- toYaml .Values.bookManagement.resources | nindent 12 }}
          # Hold liveness/readiness off until the app has booted (~45s), so a slow
          # start is not mistaken for a failure and killed into a crash loop.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.bookManagement.containerPort }}
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.bookManagement.containerPort }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.bookManagement.containerPort }}
            periodSeconds: 10
            failureThreshold: 3
{{- end }}
