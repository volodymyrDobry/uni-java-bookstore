{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uni-book-store.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
type: Opaque
# Values come from the chart values (never hard-coded in the template).
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  # LocalStack accepts any credentials; these dummy values match compose defaults.
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
{{- end }}
