{{- if .Values.keycloakDb.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "uni-book-store.keycloakDb.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.keycloakDb.persistence.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uni-book-store.keycloakDb.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "keycloak-db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "keycloak-db") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.keycloakDb.image.repository }}:{{ .Values.keycloakDb.image.tag }}"
          imagePullPolicy: {{ .Values.keycloakDb.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.keycloakDb.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.keycloakDb.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "uni-book-store.keycloak.fullname" . }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.keycloakDb.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.keycloakDb.auth.username }} -d {{ .Values.keycloakDb.auth.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
        {{- if .Values.keycloakDb.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "uni-book-store.keycloakDb.fullname" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uni-book-store.keycloakDb.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-db
spec:
  type: ClusterIP
  selector:
    {{- include "uni-book-store.selectorLabels" (dict "ctx" . "component" "keycloak-db") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
