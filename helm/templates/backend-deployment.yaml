apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uni-book-store.backend.fullname" . }}
  labels:
    {{- include "uni-book-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "uni-book-store.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uni-book-store.backend.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z {{ include "uni-book-store.postgres.fullname" . }} {{ .Values.postgres.service.port }}; do echo waiting for postgres; sleep 2; done"
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "uni-book-store.backend.fullname" . }}
            - secretRef:
                name: {{ include "uni-book-store.fullname" . }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.backend.containerPort }}
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.backend.containerPort }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.backend.containerPort }}
            periodSeconds: 10
            failureThreshold: 3
