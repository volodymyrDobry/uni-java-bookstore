# DEV environment overrides (applied on top of values.yaml).
# Lightweight: 1 replica, small resources, 1.0.0 image, no Ingress,
# ephemeral DB — reached locally via NodePort / port-forward.

backend:
  replicaCount: 1
  image:
    tag: "1.0.0"
  service:
    type: NodePort
    nodePort: 30080
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

ingress:
  enabled: false

postgres:
  persistence:
    enabled: false
