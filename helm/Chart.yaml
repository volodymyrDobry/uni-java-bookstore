apiVersion: v2
name: uni-book-store
description: Helm chart for the uni-book-store stack — book-management-service and order-service (Spring Boot), the React SPA gateway, PostgreSQL, Keycloak (+ its DB), ActiveMQ and LocalStack
type: application
version: 0.2.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled