name: CI

# Runs on every push to main and on every Pull Request targeting main,
# so the pipeline status is shown directly in the PR interface.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege by default; the publish job requests more where needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & Test — backend service (Spring Boot / Gradle, Java 25)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (with Gradle dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # a) Build — compile + package the runnable JAR
      - name: Build (bootJar)
        run: ./gradlew clean bootJar -x test --no-daemon

      # b) Test — unit/integration tests + coverage verification (JaCoCo)
      - name: Test
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Static analysis — Checkstyle (BLOCKING). Runs in parallel with tests.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static analysis (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (with Gradle dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Blocking: any violation fails the job (maxErrors=0 / maxWarnings=0).
      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Build container image (local only, no publish) + vulnerability scan.
  #    Depends on successful build/test AND static analysis.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build image & scan
    runs-on: ubuntu-latest
    needs: [ build-and-test, static-analysis ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image locally into the runner (load: true, push: false),
      # using the Dockerfile from Lab 1.
      - name: Build backend image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: uni-book-store-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Recommended: blocking vulnerability scan before any publish.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: uni-book-store-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  # ---------------------------------------------------------------------------
  # 4. Publish image to GitHub Container Registry (ghcr.io).
  #    Only on push (never on Pull Requests). Two tags: commit SHA + latest.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [ docker-build ]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Auth via the built-in GITHUB_TOKEN — no credentials stored in the repo.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Tags: unique build tag (sha-<short>) + latest (default branch only).
      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
