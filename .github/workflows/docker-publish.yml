name: Build & publish images

# Publishes the two service images to GHCR with a concrete tag (never only
# `latest`), so a GitOps cluster (Lab 5) can pull them without `minikube image load`.
#
#   - push to main            -> tags: sha-<short>, latest
#   - push a git tag v1.2.3    -> tags: 1.2.3, 1.2 (semver)  [the release flow]
#   - manual run (dispatch)    -> tag: the version you type
# Chart/GitOps-only changes do not need an image rebuild.
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'k8s/**'
      - 'helm/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish (e.g. 1.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gate: compile, checkstyle, tests, coverage (same as `./gradlew build`).
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon

  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ build-test ]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: book-management-service
            dockerfile: book-management-service/Dockerfile
          - service: order-service
            dockerfile: order-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Multi-arch so the image runs on both amd64 and arm64 nodes
      # (e.g. Apple Silicon minikube).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a vX.Y.Z release, open a PR in the GitOps repo bumping both service image
  # tags to this version. You merge it by hand to let Argo CD redeploy.
  bump-gitops:
    name: Open GitOps bump PR
    runs-on: ubuntu-latest
    needs: [ publish ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: volodymyrDobry/uni-book-store-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Bump backend image tags
        run: |
          yq -i '.bookManagement.image.tag = strenv(VERSION) | .orderService.image.tag = strenv(VERSION)' \
            gitops/charts/uni-book-store/values-minikube.yaml

      - name: Open PR in GitOps repo
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          base: main
          branch: bump/backend-${{ env.VERSION }}
          delete-branch: true
          commit-message: "chore: bump backend images to ${{ env.VERSION }}"
          title: "Release backend ${{ env.VERSION }}"
          body: |
            Automated by `${{ github.repository }}` @ `${{ github.ref_name }}`.

            Bumps `book-management-service` and `order-service` to `${{ env.VERSION }}`.
            Merge to let Argo CD redeploy.
