name: Build & publish images

# Publishes the two service images to GHCR with a concrete tag (never only
# `latest`), so a GitOps cluster (Lab 5) can pull them without `minikube image load`.
#
#   - push to main            -> tags: sha-<short>, latest
#   - push a git tag v1.2.3    -> tags: 1.2.3, 1.2 (semver)  [the release flow]
#   - manual run (dispatch)    -> tag: the version you type
# Chart/GitOps-only changes do not need an image rebuild.
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'k8s/**'
      - 'helm/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish (e.g. 1.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gate: compile, checkstyle, tests, coverage (same as `./gradlew build`).
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon

  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ build-test ]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: book-management-service
            dockerfile: book-management-service/Dockerfile
          - service: order-service
            dockerfile: order-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
